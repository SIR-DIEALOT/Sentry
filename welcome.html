<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome · Sentry</title>
<style>
/* =========================================================
   SENTINEL — Design System
   Dark glass security console. Inter for UI, JetBrains Mono
   for scores/data — the "console" signature running through
   every number in the product.
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg: #0B1020;
  --bg-elevated: #0E1426;
  --surface: rgba(255,255,255,0.045);
  --surface-strong: rgba(255,255,255,0.075);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);

  --primary: #3B82F6;
  --primary-soft: rgba(59,130,246,0.16);
  --primary-glow: rgba(59,130,246,0.45);
  --violet: #6366F1;

  --green: #22C55E;
  --green-soft: rgba(34,197,94,0.14);
  --yellow: #FACC15;
  --yellow-soft: rgba(250,204,21,0.14);
  --red: #EF4444;
  --red-soft: rgba(239,68,68,0.14);

  --text-primary: #F3F5FA;
  --text-secondary: #9AA4BF;
  --text-tertiary: #626C87;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --shadow-soft: 0 8px 30px rgba(0,0,0,0.35);
  --shadow-lift: 0 16px 50px rgba(0,0,0,0.5);
  --ease: cubic-bezier(.16,.8,.24,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:
    radial-gradient(circle at 12% -10%, rgba(59,130,246,0.16), transparent 45%),
    radial-gradient(circle at 100% 0%, rgba(99,102,241,0.10), transparent 40%),
    var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--primary-soft); color:#fff; }
a{ color:inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:20px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.2); }

:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }

.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

/* =========== APP SHELL =========== */
.app-shell{
  display:grid;
  grid-template-columns:272px 1fr;
  min-height:100vh;
}

/* =========== SIDEBAR =========== */
.sidebar{
  position:sticky; top:0; height:100vh;
  padding:26px 18px;
  display:flex; flex-direction:column;
  border-right:1px solid var(--border);
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  backdrop-filter:blur(20px);
}
.brand{
  display:flex; align-items:center; gap:11px;
  padding:8px 10px 26px 10px;
}
.brand-mark{
  width:36px; height:36px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, var(--primary), var(--violet));
  box-shadow:0 0 0 1px rgba(255,255,255,0.12) inset, 0 6px 18px rgba(59,130,246,0.45);
  flex-shrink:0;
}
.brand-mark svg{ width:19px; height:19px; stroke:#fff; }
.brand-name{ font-weight:800; font-size:17px; letter-spacing:-0.02em; }
.brand-sub{ font-size:10.5px; color:var(--text-tertiary); letter-spacing:0.08em; text-transform:uppercase; margin-top:1px; }

.nav-group-label{
  font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--text-tertiary); padding:16px 12px 8px;
}
.nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:12px;
  color:var(--text-secondary); font-size:13.5px; font-weight:500;
  transition:all .18s var(--ease);
  position:relative;
}
.nav-item svg{ width:17px; height:17px; stroke-width:2; flex-shrink:0; opacity:0.85; transition:opacity .18s; }
.nav-item:hover{ background:var(--surface); color:var(--text-primary); transform:translateX(2px); }
.nav-item.active{
  background:linear-gradient(90deg, var(--primary-soft), rgba(59,130,246,0.02));
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(59,130,246,0.25);
}
.nav-item.active svg{ opacity:1; stroke:var(--primary); }
.nav-item.active::before{
  content:''; position:absolute; left:-18px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:3px; background:var(--primary);
  box-shadow:0 0 10px var(--primary-glow);
}
.nav-badge{
  margin-left:auto; font-family:var(--font-mono); font-size:10px; font-weight:700;
  background:var(--red-soft); color:var(--red); padding:2px 6px; border-radius:20px;
}

.sidebar-footer{
  border-top:1px solid var(--border); padding-top:14px; margin-top:10px;
}
.profile-card{
  display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px;
  transition:background .18s;
}
.profile-card:hover{ background:var(--surface); }
.avatar{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(145deg,#232B45,#161B2E);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; border:1px solid var(--border-strong);
  position:relative;
}
.status-dot{
  position:absolute; bottom:-2px; right:-2px; width:9px; height:9px; border-radius:50%;
  background:var(--green); border:2px solid var(--bg-elevated);
  box-shadow:0 0 8px var(--green);
}
.profile-name{ font-size:13px; font-weight:600; }
.profile-role{ font-size:11px; color:var(--text-tertiary); }
.version-tag{
  font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary);
  padding:10px 8px 0; display:flex; justify-content:space-between; align-items:center;
}
.online-pill{
  display:flex; align-items:center; gap:5px; color:var(--green); font-weight:600;
}
.online-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse-dot 2s infinite; }

@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

/* =========== MAIN =========== */
.main{ padding:34px 40px 70px; min-width:0; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:30px;
  animation:fadeUp .5s var(--ease);
}
.page-eyebrow{ font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--primary); margin:0 0 6px; }
.page-title{ font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0; }
.page-desc{ color:var(--text-secondary); font-size:13.5px; margin-top:6px; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }

.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  transition:all .18s var(--ease); position:relative;
}
.icon-btn:hover{ background:var(--surface-strong); border-color:var(--border-strong); transform:translateY(-1px); }
.icon-btn svg{ width:16px; height:16px; stroke:var(--text-secondary); }

.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
  border:1px solid transparent; transition:all .18s var(--ease); white-space:nowrap;
}
.btn svg{ width:15px; height:15px; }
.btn-primary{
  background:linear-gradient(145deg, #4C8DF9, var(--primary));
  color:#fff; box-shadow:0 4px 18px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 26px rgba(59,130,246,0.55), inset 0 1px 0 rgba(255,255,255,0.25); }
.btn-ghost{
  background:var(--surface); border:1px solid var(--border); color:var(--text-primary);
}
.btn-ghost:hover{ background:var(--surface-strong); border-color:var(--border-strong); }
.btn-danger{ background:linear-gradient(145deg,#f36565,var(--red)); color:#fff; box-shadow:0 4px 18px rgba(239,68,68,0.35); }
.btn-danger:hover{ transform:translateY(-1px); }
.btn-success{ background:linear-gradient(145deg,#37d372,var(--green)); color:#06210f; box-shadow:0 4px 18px rgba(34,197,94,0.35); }
.btn-block{ width:100%; }
.btn-lg{ padding:15px 26px; font-size:14.5px; border-radius:14px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important; }

/* =========== CARDS / GLASS =========== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-soft);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.card-hover:hover{
  transform:translateY(-3px);
  border-color:var(--border-strong);
  box-shadow:var(--shadow-lift);
}
.card-pad{ padding:22px; }

.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-6{ grid-template-columns:repeat(6,1fr); }

@media (max-width:1200px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-6{grid-template-columns:repeat(3,1fr);} }
@media (max-width:900px){ .app-shell{grid-template-columns:1fr;} .sidebar{display:none;} .grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;} .main{padding:22px;} }

/* Stat card */
.stat-card{ padding:20px; display:flex; flex-direction:column; gap:10px; }
.stat-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-icon{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
}
.stat-icon svg{ width:16px; height:16px; }
.stat-icon.blue{ background:var(--primary-soft); } .stat-icon.blue svg{ stroke:var(--primary); }
.stat-icon.green{ background:var(--green-soft); } .stat-icon.green svg{ stroke:var(--green); }
.stat-icon.yellow{ background:var(--yellow-soft); } .stat-icon.yellow svg{ stroke:var(--yellow); }
.stat-icon.red{ background:var(--red-soft); } .stat-icon.red svg{ stroke:var(--red); }
.stat-icon.violet{ background:rgba(99,102,241,0.16); } .stat-icon.violet svg{ stroke:var(--violet); }
.stat-value{ font-family:var(--font-mono); font-size:28px; font-weight:700; letter-spacing:-0.02em; }
.stat-label{ font-size:12.5px; color:var(--text-secondary); }
.stat-delta{ font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:4px; width:fit-content; }
.stat-delta.up{ color:var(--green); }
.stat-delta.down{ color:var(--red); }

/* Section heading */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin:34px 0 16px; }
.section-title{ font-size:15.5px; font-weight:700; letter-spacing:-0.01em; }
.section-link{ font-size:12.5px; color:var(--primary); font-weight:600; }

/* =========== PROTECTION RING =========== */
.ring-wrap{ position:relative; width:190px; height:190px; }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:rgba(255,255,255,0.06); stroke-width:11; }
.ring-fg{
  fill:none; stroke:url(#ringGrad); stroke-width:11; stroke-linecap:round;
  stroke-dasharray:503; stroke-dashoffset:503;
  transition:stroke-dashoffset 1.6s var(--ease);
  filter:drop-shadow(0 0 10px rgba(59,130,246,0.55));
}
.ring-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring-score{ font-family:var(--font-mono); font-size:42px; font-weight:700; letter-spacing:-0.02em; }
.ring-score span{ font-size:17px; color:var(--text-tertiary); font-weight:500; }
.ring-caption{ font-size:11px; color:var(--green); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; margin-top:4px; }

/* =========== TIMELINE =========== */
.timeline{ display:flex; flex-direction:column; }
.tl-item{ display:flex; gap:14px; padding:14px 4px; position:relative; }
.tl-item:not(:last-child)::before{
  content:''; position:absolute; left:19px; top:42px; bottom:-4px; width:1px;
  background:linear-gradient(180deg, var(--border-strong), transparent);
}
.tl-dot{
  width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong);
}
.tl-dot svg{ width:16px; height:16px; }
.tl-dot.red{ background:var(--red-soft); } .tl-dot.red svg{ stroke:var(--red); }
.tl-dot.green{ background:var(--green-soft); } .tl-dot.green svg{ stroke:var(--green); }
.tl-dot.yellow{ background:var(--yellow-soft); } .tl-dot.yellow svg{ stroke:var(--yellow); }
.tl-dot.blue{ background:var(--primary-soft); } .tl-dot.blue svg{ stroke:var(--primary); }
.tl-title{ font-size:13.5px; font-weight:600; }
.tl-meta{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }
.tl-time{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); white-space:nowrap; }

/* =========== BADGES =========== */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px;
  font-size:11px; font-weight:700; letter-spacing:0.02em;
}
.badge svg{ width:11px; height:11px; }
.badge.green{ background:var(--green-soft); color:var(--green); }
.badge.yellow{ background:var(--yellow-soft); color:var(--yellow); }
.badge.red{ background:var(--red-soft); color:var(--red); }
.badge.blue{ background:var(--primary-soft); color:var(--primary); }
.badge.grey{ background:var(--surface-strong); color:var(--text-secondary); }

/* =========== BAR / CHART (pure CSS) =========== */
.bar-chart{ display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:10px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.bar{
  width:100%; max-width:26px; border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg, var(--primary), rgba(59,130,246,0.25));
  box-shadow:0 0 14px rgba(59,130,246,0.35);
  transform:scaleY(0); transform-origin:bottom; transition:transform 1s var(--ease);
}
.bar-label{ font-size:10.5px; color:var(--text-tertiary); font-family:var(--font-mono); }

.heatmap{ display:grid; grid-template-columns:repeat(12,1fr); gap:5px; }
.heat-cell{ aspect-ratio:1; border-radius:5px; background:rgba(255,255,255,0.05); transition:transform .15s; }
.heat-cell:hover{ transform:scale(1.2); }
.heat-cell.l1{ background:rgba(59,130,246,0.18); }
.heat-cell.l2{ background:rgba(59,130,246,0.4); }
.heat-cell.l3{ background:rgba(59,130,246,0.68); }
.heat-cell.l4{ background:var(--primary); box-shadow:0 0 10px var(--primary-glow); }

.donut-wrap{ position:relative; width:150px; height:150px; margin:0 auto; }
.donut-wrap svg{ transform:rotate(-90deg); width:100%; height:100%; }
.donut-seg{ fill:none; stroke-width:16; transition:stroke-dashoffset 1.2s var(--ease); }
.donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-center .num{ font-family:var(--font-mono); font-size:22px; font-weight:700; }
.donut-center .lbl{ font-size:10px; color:var(--text-tertiary); }

.progress{ height:8px; border-radius:20px; background:rgba(255,255,255,0.06); overflow:hidden; }
.progress-fill{ height:100%; border-radius:20px; width:0%; transition:width 1.2s var(--ease); }
.progress-fill.blue{ background:linear-gradient(90deg,#4C8DF9,var(--primary)); box-shadow:0 0 10px var(--primary-glow); }
.progress-fill.green{ background:linear-gradient(90deg,#4ee08a,var(--green)); box-shadow:0 0 10px rgba(34,197,94,0.5); }
.progress-fill.yellow{ background:linear-gradient(90deg,#ffe066,var(--yellow)); box-shadow:0 0 10px rgba(250,204,21,0.5); }
.progress-fill.red{ background:linear-gradient(90deg,#ff7b7b,var(--red)); box-shadow:0 0 10px rgba(239,68,68,0.5); }

/* =========== TOGGLES =========== */
.setting-row{
  display:flex; align-items:center; justify-content:space-between; padding:18px 4px;
  border-bottom:1px solid var(--border);
}
.setting-row:last-child{ border-bottom:none; }
.setting-left{ display:flex; gap:14px; align-items:flex-start; }
.setting-icon{
  width:38px; height:38px; border-radius:11px; background:var(--surface-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);
}
.setting-icon svg{ width:17px; height:17px; stroke:var(--primary); }
.setting-title{ font-size:13.5px; font-weight:600; }
.setting-desc{ font-size:12px; color:var(--text-tertiary); margin-top:3px; max-width:420px; line-height:1.5; }

.switch{ position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch-track{
  position:absolute; inset:0; background:rgba(255,255,255,0.1); border-radius:20px; border:1px solid var(--border-strong);
  transition:background .25s var(--ease); cursor:pointer;
}
.switch-track::after{
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.4); transition:transform .25s var(--ease);
}
.switch input:checked + .switch-track{ background:linear-gradient(145deg,#4C8DF9,var(--primary)); border-color:transparent; box-shadow:0 0 12px var(--primary-glow); }
.switch input:checked + .switch-track::after{ transform:translateX(20px); }

/* =========== FORMS =========== */
.search-box{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--border-strong); border-radius:18px; padding:8px 8px 8px 22px;
  box-shadow:var(--shadow-soft); transition:border-color .2s, box-shadow .2s;
}
.search-box:focus-within{ border-color:var(--primary); box-shadow:0 0 0 4px rgba(59,130,246,0.14); }
.search-box svg{ width:19px; height:19px; stroke:var(--text-tertiary); flex-shrink:0; }
.search-box input{
  flex:1; background:none; border:none; outline:none; color:var(--text-primary);
  font-family:var(--font-mono); font-size:15px; padding:14px 0;
}
.search-box input::placeholder{ color:var(--text-tertiary); font-family:var(--font-ui); }

/* =========== SCAN PROGRESS =========== */
.scan-steps{ display:flex; flex-direction:column; gap:14px; margin:30px auto; max-width:420px; }
.scan-step{ display:flex; align-items:center; gap:12px; opacity:0.3; transition:opacity .3s; }
.scan-step.active{ opacity:1; }
.scan-step.done{ opacity:0.7; }
.step-dot{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
}
.scan-step.active .step-dot{ border-color:var(--primary); }
.scan-step.active .step-dot::after{
  content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--primary);
  border-top-color:transparent; animation:spin 0.9s linear infinite;
}
.scan-step.done .step-dot{ border-color:var(--green); background:var(--green-soft); }
.scan-step.done .step-dot svg{ width:12px; height:12px; stroke:var(--green); }
.step-text{ font-size:13.5px; font-family:var(--font-mono); color:var(--text-secondary); }
.scan-step.active .step-text{ color:var(--text-primary); }
@keyframes spin{ to{ transform:rotate(360deg); } }

.result-hero{ text-align:center; padding:30px 20px; }
.result-icon-wrap{
  width:96px; height:96px; border-radius:26px; margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
  position:relative;
}
.result-icon-wrap svg{ width:44px; height:44px; }
.result-icon-wrap.safe{ background:var(--green-soft); box-shadow:0 0 40px rgba(34,197,94,0.35); } .result-icon-wrap.safe svg{ stroke:var(--green); }
.result-icon-wrap.warning{ background:var(--yellow-soft); box-shadow:0 0 40px rgba(250,204,21,0.3); } .result-icon-wrap.warning svg{ stroke:var(--yellow); }
.result-icon-wrap.danger{ background:var(--red-soft); box-shadow:0 0 40px rgba(239,68,68,0.35); } .result-icon-wrap.danger svg{ stroke:var(--red); }

.trust-score-lg{ font-family:var(--font-mono); font-size:52px; font-weight:800; letter-spacing:-0.02em; }
.reason-list{ display:flex; flex-direction:column; gap:10px; text-align:left; margin-top:20px; }
.reason-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--text-secondary); line-height:1.5; }
.reason-item svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; }

/* =========== TOAST =========== */
.toast-stack{ position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:10px; z-index:999; }
.toast{
  display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:14px;
  background:rgba(14,20,38,0.92); border:1px solid var(--border-strong); backdrop-filter:blur(14px);
  box-shadow:var(--shadow-lift); font-size:13px; font-weight:500; min-width:260px;
  animation:toastIn .35s var(--ease);
}
.toast svg{ width:17px; height:17px; flex-shrink:0; }
.toast.success svg{ stroke:var(--green); }
.toast.error svg{ stroke:var(--red); }
.toast.info svg{ stroke:var(--primary); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
.toast.hide{ animation:toastOut .3s var(--ease) forwards; }
@keyframes toastOut{ to{ opacity:0; transform:translateX(30px); } }

/* =========== ANIMATIONS =========== */
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.fade-up{ animation:fadeUp .55s var(--ease) both; }
.stagger > *{ animation:fadeUp .55s var(--ease) both; }
.stagger > *:nth-child(1){ animation-delay:.03s; }
.stagger > *:nth-child(2){ animation-delay:.08s; }
.stagger > *:nth-child(3){ animation-delay:.13s; }
.stagger > *:nth-child(4){ animation-delay:.18s; }
.stagger > *:nth-child(5){ animation-delay:.23s; }
.stagger > *:nth-child(6){ animation-delay:.28s; }

.pulse-ring{
  position:absolute; inset:0; border-radius:inherit; border:2px solid var(--primary);
  animation:pulseRing 2.4s var(--ease) infinite;
}
@keyframes pulseRing{ 0%{ opacity:.7; transform:scale(1);} 100%{ opacity:0; transform:scale(1.35);} }

/* File / permission rows */
.file-row, .perm-card{
  display:flex; align-items:center; gap:16px; padding:18px; border-radius:16px;
}
.file-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:var(--surface-strong); border:1px solid var(--border);
}
.file-icon svg{ width:19px; height:19px; stroke:var(--text-secondary); }
.file-name{ font-size:14px; font-weight:600; }
.file-meta{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }
.file-reason{ font-size:12px; color:var(--text-secondary); margin-top:6px; }

.perm-card{ flex-direction:column; align-items:stretch; gap:14px; }
.perm-top{ display:flex; align-items:center; gap:12px; }
.perm-icon{
  width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
}
.perm-icon svg{ width:19px; height:19px; }
.perm-actions{ display:flex; gap:8px; margin-top:4px; }
.perm-actions .btn{ flex:1; padding:9px 14px; font-size:12.5px; }

/* QR */
.qr-frame{
  width:100%; max-width:340px; aspect-ratio:1; margin:0 auto; border-radius:28px;
  background:radial-gradient(circle at 50% 40%, rgba(59,130,246,0.12), transparent 70%), var(--bg-elevated);
  border:1px solid var(--border-strong); position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.qr-corner{ position:absolute; width:34px; height:34px; border:3px solid var(--primary); }
.qr-corner.tl{ top:20px; left:20px; border-right:none; border-bottom:none; border-radius:10px 0 0 0; }
.qr-corner.tr{ top:20px; right:20px; border-left:none; border-bottom:none; border-radius:0 10px 0 0; }
.qr-corner.bl{ bottom:20px; left:20px; border-right:none; border-top:none; border-radius:0 0 0 10px; }
.qr-corner.br{ bottom:20px; right:20px; border-left:none; border-top:none; border-radius:0 0 10px 0; }
.qr-scanline{
  position:absolute; left:20px; right:20px; height:2px;
  background:linear-gradient(90deg, transparent, var(--primary), transparent);
  box-shadow:0 0 14px var(--primary-glow);
  animation:scanline 2.2s ease-in-out infinite;
}
@keyframes scanline{ 0%,100%{ top:20px; } 50%{ top:calc(100% - 22px); } }

/* Reports */
.legend{ display:flex; flex-direction:column; gap:12px; }
.legend-item{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
.legend-dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.legend-item .val{ margin-left:auto; font-family:var(--font-mono); font-weight:600; color:var(--text-primary); }

.domain-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
.domain-row:last-child{ border-bottom:none; }
.domain-rank{ font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); width:18px; }
.domain-name{ font-size:13px; font-weight:600; flex:1; }
.domain-count{ font-family:var(--font-mono); font-size:12px; color:var(--red); }

.tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); padding:4px; border-radius:12px; width:fit-content; }
.tab{ padding:8px 16px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--text-secondary); transition:all .18s; }
.tab.active{ background:var(--primary); color:#fff; box-shadow:0 4px 14px rgba(59,130,246,0.4); }

.empty-hint{ text-align:center; padding:50px 20px; color:var(--text-tertiary); font-size:13px; }


/* Sentry Custom Logo Update */
.custom-logo {
  background: url('logo.png') no-repeat center center / 100%;
  border: none;
}
</style>

</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div class="card card-pad fade-up" style="max-width:420px; width:100%; text-align:center; padding:40px 36px;">
    <div class="brand-mark custom-logo" style="width:52px; height:52px; border-radius:15px; margin:0 auto 22px;"></div>
    <h1 style="font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px;">Welcome to Sentry</h1>
    <p style="font-size:13.5px; color:var(--text-secondary); line-height:1.6; margin:0 0 28px;">
      What should we call you? This stays only in your browser -- nothing is sent anywhere, and you can change it anytime in Settings.
    </p>
    <input type="text" id="nameInput" placeholder="Your name" autocomplete="name" maxlength="40"
      style="width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:14px; padding:14px 18px; color:var(--text-primary); font-family:var(--font-ui); font-size:15px; outline:none; text-align:center; box-sizing:border-box;"
      onkeydown="if(event.key==='Enter') startSentry()">
    <button class="btn btn-primary btn-lg btn-block" style="margin-top:16px;" onclick="startSentry()">Get Started</button>
    <p id="nameError" style="display:none; font-size:12px; color:var(--red); margin-top:12px;">Enter a name to continue.</p>
  </div>
</div>
<script>
  function startSentry(){
    const input = document.getElementById('nameInput');
    const val = input.value.trim();
    if(!val){
      document.getElementById('nameError').style.display = 'block';
      input.focus();
      return;
    }
    localStorage.setItem('sentinel_user_name', val);
    location.href = 'index.html';
  }
  document.getElementById('nameInput')?.focus?.();
</script>
</body>
</html>
